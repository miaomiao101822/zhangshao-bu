        document.querySelectorAll('[data-fsub]').forEach(function (b) {
          b.classList.toggle('active', b.dataset.fsub === State.fridgeSub);
        });

        var container = document.getElementById('fridge-content');
        if (State.fridgeSub === 'inventory') renderFridgeInventory(container);
        else renderFridgeRecommend(container);
      }

      function renderFridgeInventory(container) {
        var expiring = State.fridge.filter(function (it) { return daysUntilExpiry(it.expiryDate) <= 2; });
        var hasExpired = expiring.some(function (it) { return daysUntilExpiry(it.expiryDate) < 0; });
        var autoPrev = classifyIngredient(State.quickName);
        var autoZoneMeta = FRIDGE_ZONES.find(function (z) { return z.key === autoPrev.zone; }) || FRIDGE_ZONES[1];

        var htmlStr = '';

        // 1. 顶部快捷入库卡片
        htmlStr += '<div class="fridge-quick-card">'
          + '<div class="fridge-quick-row">'
          + '<input id="fq-name" class="f-input" style="flex:1.5;min-width:0;padding:8px 10px;" type="text" placeholder="输入食材名（如：牛腩、生菜）" value="' + esc(State.quickName) + '" />'
          + '<input id="fq-amt" class="f-input tabular" style="width:68px;padding:8px 7px;text-align:center;" type="number" step="any" min="0.1" value="' + esc(State.quickAmt) + '" />'
          + '<select id="fq-unit" class="f-select" style="width:60px;padding:8px 4px;">'
          + FRIDGE_UNITS.map(function (u) { return '<option value="' + u + '"' + (State.quickUnit === u ? ' selected' : '') + '>' + u + '</option>'; }).join('')
          + '</select>'
          + '<button id="fq-submit" class="btn-primary-sm" style="height:36px;padding:0 12px;border-radius:10px;" type="button">存入</button>'
          + '</div>'
          + '<div id="fq-hint" class="fridge-quick-hint">'
          + (State.quickName.trim()
            ? '<span>自动分配：<b style="color:var(--text-main);">' + esc(autoZoneMeta.title) + '</b>（' + esc(autoPrev.reason) + '）</span><span>保质 ' + autoPrev.days + ' 天</span>'
            : '<span>输入名称和重量，自动归入冷鲜 / 冷藏 / 冷冻</span><span>可随时手动改层</span>')
          + '</div></div>';

        // 2. 临期提醒横幅
        if (expiring.length) {
          var names = expiring.slice(0, 3).map(function (x) { return x.name; }).join('、') + (expiring.length > 3 ? ' 等' : '');
          htmlStr += '<div class="exp-banner ' + (hasExpired ? 'has-expired' : '') + '">'
            + '<div style="min-width:0;flex:1;">'
            + '<div style="font-size:12.5px;font-weight:700;color:' + (hasExpired ? 'var(--danger)' : 'var(--amber)') + ';">'
            + (hasExpired ? '⚠️ 有食材已过期或临期' : '⏰ ' + expiring.length + ' 项食材即将临期') + '</div>'
            + '<div style="font-size:11.5px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(names) + ' · 建议优先安排下锅</div>'
            + '</div>'
            + '<button id="btn-exp-to-rec" class="btn-primary-sm" style="height:30px;padding:0 11px;font-size:11.5px;" type="button">看推荐菜</button>'
            + '</div>';
        }

        // 3. 上/中/下 三层紧凑卡片列表
        FRIDGE_ZONES.forEach(function (z) {
          var items = State.fridge
            .filter(function (it) { return it.zone === z.key; })
            .sort(function (a, b) { return daysUntilExpiry(a.expiryDate) - daysUntilExpiry(b.expiryDate); });
          var collapsed = !!State.fridgeCollapsed[z.key];

          htmlStr += '<div class="tier-card">'
            + '<button class="tier-head t-' + z.key + (collapsed ? ' collapsed' : '') + '" data-toggle-tier="' + z.key + '" type="button">'
            + '<div class="tier-title-wrap">'
            + '<span class="tier-name">' + esc(z.title) + '</span>'
            + '<span class="tag ' + z.tagCls + '">' + esc(z.temp) + '</span>'
            + '</div>'
            + '<span style="font-size:12px;color:var(--text-sub);font-weight:600;">' + items.length + ' 项 ' + (collapsed ? '▼' : '▲') + '</span>'
            + '</button>';

          if (!collapsed) {
            if (!items.length) {
              htmlStr += '<div class="tier-empty">暂未存放' + esc(z.desc) + '</div>';
            } else {
              htmlStr += items.map(function (it) {
                var dLeft = daysUntilExpiry(it.expiryDate);
                var expTag = dLeft < 0
                  ? '<span class="tag danger">已过期 ' + Math.abs(dLeft) + ' 天</span>'
                  : (dLeft === 0
                    ? '<span class="tag danger">今天到期</span>'
                    : (dLeft <= 2
                      ? '<span class="tag amber">剩 ' + dLeft + ' 天</span>'
                      : '<span class="tag sage">剩 ' + dLeft + ' 天</span>'));

                return '<div class="fridge-item-row">'
                  + '<div class="fridge-item-main" data-edit-fr="' + esc(it.id) + '">'
                  + '<div class="fridge-item-name"><span>' + esc(it.name) + '</span>' + expTag + '</div>'
                  + '<div class="fridge-item-sub">到期 ' + esc(it.expiryDate || '未设置') + ' · 点击可改层或编辑</div>'
                  + '</div>'
                  + '<div class="qty-pill-ctrl">'
                  + '<button class="qty-mini-btn" data-fdec="' + esc(it.id) + '" type="button" aria-label="减少">−</button>'
                  + '<span class="qty-mini-val tabular" data-edit-fr="' + esc(it.id) + '">' + esc(formatQty(it.amount, it.unit)) + '</span>'
                  + '<button class="qty-mini-btn" data-finc="' + esc(it.id) + '" type="button" aria-label="增加">＋</button>'
                  + '</div></div>';
              }).join('');
            }
          }
          htmlStr += '</div>';
        });

        container.innerHTML = htmlStr;

        // 绑定快捷入库事件
        var qName = document.getElementById('fq-name');
        var qAmt = document.getElementById('fq-amt');
        var qUnit = document.getElementById('fq-unit');
        var qHint = document.getElementById('fq-hint');

        qName.oninput = function () {
          State.quickName = qName.value;
          if (!qName.value.trim()) {
            qHint.innerHTML = '<span>输入名称和重量，自动归入冷鲜 / 冷藏 / 冷冻</span><span>可随时手动改层</span>';
          } else {
            var info = classifyIngredient(qName.value);
            var zm = FRIDGE_ZONES.find(function (z) { return z.key === info.zone; }) || FRIDGE_ZONES[1];
            qHint.innerHTML = '<span>自动分配：<b style="color:var(--text-main);">' + esc(zm.title) + '</b>（' + esc(info.reason) + '）</span><span>保质 ' + info.days + ' 天</span>';
          }
        };
        qAmt.oninput = function () { State.quickAmt = qAmt.value; };
        qUnit.onchange = function () { State.quickUnit = qUnit.value; };

        function doQuickAdd() {
          var n = qName.value.trim();
          var a = parseFloat(qAmt.value);
          var u = qUnit.value || 'g';
          if (!n) { showToast('请输入食材名称'); qName.focus(); return; }
          if (isNaN(a) || a <= 0) { showToast('请输入有效重量或数量'); qAmt.focus(); return; }
          var info = classifyIngredient(n);
          var existing = State.fridge.find(function (x) { return x.name === n && x.unit === u && x.zone === info.zone; });
          if (existing) {
            existing.amount = Math.round((existing.amount + a) * 100) / 100;
            existing.expiryDate = dateStrOffset(info.days);
          } else {
            State.fridge.unshift({
              id: 'fr_' + Date.now() + '_' + Math.floor(Math.random() * 100),
              name: n,
              amount: Math.round(a * 100) / 100,
              unit: u,
              zone: info.zone,
              expiryDate: dateStrOffset(info.days)
            });
          }
          State.quickName = '';
          saveFridge();
          updateFridgeBadge();
          var zm = FRIDGE_ZONES.find(function (z) { return z.key === info.zone; });
          showToast('已存入「' + (zm ? zm.title : '冷藏区') + '」：' + n + ' ' + formatQty(a, u));
          renderFridgeTab();
        }

        document.getElementById('fq-submit').onclick = doQuickAdd;
        qName.onkeydown = function (e) { if (e.key === 'Enter') doQuickAdd(); };

        var expBtn = document.getElementById('btn-exp-to-rec');
        if (expBtn) {
          expBtn.onclick = function () {
            State.fridgeSub = 'recommend';
            renderFridgeTab();
          };
        }

        container.querySelectorAll('[data-toggle-tier]').forEach(function (b) {
          b.onclick = function () {
            var k = b.dataset.toggleTier;
            State.fridgeCollapsed[k] = !State.fridgeCollapsed[k];
            renderFridgeInventory(container);
          };
        });

        container.querySelectorAll('[data-edit-fr]').forEach(function (el) {
          el.onclick = function () { openFridgeModal(el.dataset.editFr); };
        });

        container.querySelectorAll('[data-finc]').forEach(function (b) {
          b.onclick = function () {
            var it = State.fridge.find(function (x) { return x.id === b.dataset.finc; });
            if (!it) return;
            it.amount = Math.round((it.amount + getStepDelta(it.unit)) * 100) / 100;
            saveFridge();
            renderFridgeTab();
          };
        });

        container.querySelectorAll('[data-fdec]').forEach(function (b) {
          b.onclick = function () {
            var it = State.fridge.find(function (x) { return x.id === b.dataset.fdec; });
            if (!it) return;
            var next = Math.round((it.amount - getStepDelta(it.unit)) * 100) / 100;
            if (next <= 0) {
              showConfirm('移出冰箱', '「' + it.name + '」数量将归零，确定移出冰箱吗？', function () {
                State.fridge = State.fridge.filter(function (x) { return x.id !== it.id; });
                saveFridge();
                updateFridgeBadge();
                renderFridgeTab();
                showToast('已移出「' + it.name + '」');
              });
            } else {
              it.amount = next;
              saveFridge();
              renderFridgeTab();
            }
          };
        });
      }

      function renderFridgeRecommend(container) {
        if (!State.fridge.length) {
          container.innerHTML = '<div class="empty-state">'
            + '<div class="empty-icon">' + NAV_SVG.fridge.off + '</div>'
            + '<h3>冰箱还是空的</h3>'
            + '<p>先录入家里现有的食材，系统会自动为你匹配拿手菜与世界食谱组合。</p>'
            + '<button id="btn-rec-to-inv" class="btn-primary-lg" type="button">去录入食材</button>'
            + '</div>';
          document.getElementById('btn-rec-to-inv').onclick = function () {
            State.fridgeSub = 'inventory';
            renderFridgeTab();
          };
          return;
        }

        var allRecs = computeFridgeRecommendations();
        var combos = buildMealCombos(allRecs);
        var filteredRecs = allRecs.filter(function (r) {
          if (State.recSourceFilter === 'mine') return r.source === 'mine';
          if (State.recSourceFilter === 'book') return r.source === 'book';
          return true;
        }).slice(0, 30);

        var htmlStr = '';

        // 1. 整顿饭智能搭配套餐
        if (combos.length) {
          htmlStr += '<div class="section-caption"><h2>🍽️ 整顿饭智能搭配</h2><span>一键加入今晚点菜</span></div>';
          combos.forEach(function (cb, idx) {
            htmlStr += '<div class="combo-card ' + (idx === 0 ? 'highlight' : '') + '">'
              + '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">'
              + '<div><div style="font-size:14.5px;font-weight:700;">' + esc(cb.title) + '</div>'
              + '<div style="font-size:11.5px;color:var(--text-sub);">' + esc(cb.subtitle) + '</div></div>'
              + '<button class="btn-primary-sm" data-pick-combo="' + idx + '" type="button">一键加入点菜</button>'
              + '</div>'
              + '<div class="combo-dishes">' + cb.items.map(function (it) {
                return '<span class="dish-chip">' + esc(it.dish.name)
                  + '<span style="font-size:10px;color:' + (it.source === 'mine' ? 'var(--primary)' : 'var(--slate)') + ';">' + (it.source === 'mine' ? '拿手' : '食谱') + '</span></span>';
              }).join('') + '</div>'
              + '<div class="meta-tags">'
              + '<span class="tag">并行约 ' + cb.parallelMin + ' 分钟</span>'
              + (cb.expTotal > 0 ? '<span class="tag amber">🔥 消耗 ' + cb.expTotal + ' 项临期</span>' : '')
              + (cb.missingList.length === 0
                ? '<span class="tag sage">✓ 核心食材齐全</span>'
                : '<span class="tag">还差 ' + esc(cb.missingList.slice(0, 3).join('、')) + (cb.missingList.length > 3 ? '等' : '') + '</span>')
              + '</div></div>';
          });
        }

        // 2. 单菜匹配度列表（含来源筛选）
        htmlStr += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;">'
          + '<span style="font-size:14px;font-weight:700;">按食材匹配度推荐</span>'
          + '<div style="display:flex;gap:5px;">'
          + '<button class="filter-pill ' + (State.recSourceFilter === 'all' ? 'active' : '') + '" style="height:26px;padding:0 9px;font-size:11.5px;" data-rfilter="all" type="button">全部</button>'
          + '<button class="filter-pill ' + (State.recSourceFilter === 'mine' ? 'active' : '') + '" style="height:26px;padding:0 9px;font-size:11.5px;" data-rfilter="mine" type="button">我的菜谱</button>'
          + '<button class="filter-pill ' + (State.recSourceFilter === 'book' ? 'active' : '') + '" style="height:26px;padding:0 9px;font-size:11.5px;" data-rfilter="book" type="button">世界食谱</button>'
          + '</div></div>';

        if (!filteredRecs.length) {
          htmlStr += '<div class="empty-state" style="padding:26px 16px;"><h3>当前筛选下暂无匹配菜品</h3><p style="margin-bottom:0;">可以切换到「全部」看看世界食谱，或再录入几样常用食材。</p></div>';
        } else {
          htmlStr += filteredRecs.map(function (rec, idx) {
            var d = rec.dish;
            var pct = Math.round(rec.ratio * 100);
            var statusTag = rec.missing.length === 0
              ? '<span class="tag sage">食材齐全</span>'
              : '<span class="tag amber">缺 ' + rec.missing.length + ' 样</span>';
            var srcTag = rec.source === 'mine'
              ? '<span class="tag primary">我的菜谱</span>'
              : '<span class="tag slate">食谱·' + esc(d.sub || d.major) + '</span>';
            var inCart = rec.source === 'mine' ? (State.cart[d.id] || 0) : 0;

            return '<article class="rec-card" data-open-rec="' + idx + '">'
              + '<div class="thumb" style="width:62px;height:62px;">' + renderThumbHTML(d) + '</div>'
              + '<div class="dish-info">'
              + '<div class="dish-head"><h3 class="dish-name">' + esc(d.name) + '</h3>' + statusTag + '</div>'
              + '<div class="meta-tags" style="margin-top:2px;">'
              + srcTag
              + '<span class="tag">' + getDishMinutes(d) + ' 分钟</span>'
              + (rec.expiringHits > 0 ? '<span class="tag amber">消耗临期</span>' : '<span class="tag">匹配 ' + pct + '%</span>')
              + '</div>'
              + '<div class="rec-ing-line">'
              + '<span class="rec-have">已有：' + esc(rec.matched.join('、')) + '</span>'
              + (rec.missing.length ? ' · <span class="rec-miss">缺：' + esc(rec.missing.slice(0, 3).join('、')) + (rec.missing.length > 3 ? '等' : '') + '</span>' : '')
              + '</div>'
              + '<div style="margin-top:6px;display:flex;justify-content:flex-end;" data-stop="1">'
              + '<button class="btn-primary-sm" style="height:28px;padding:0 11px;font-size:11.5px;" data-add-rec="' + idx + '" type="button">'
              + (inCart > 0 ? '已点 ' + inCart + ' 份 · 再加' : (rec.source === 'mine' ? '＋ 加入点菜' : '＋ 收录并点菜'))
              + '</button></div></div></article>';
          }).join('');
        }

        container.innerHTML = htmlStr;

        container.querySelectorAll('[data-rfilter]').forEach(function (b) {
          b.onclick = function () {
            State.recSourceFilter = b.dataset.rfilter;
            renderFridgeRecommend(container);
          };
        });

        container.querySelectorAll('[data-pick-combo]').forEach(function (b) {
          b.onclick = function () {
            var cb = combos[Number(b.dataset.pickCombo)];
            if (!cb) return;
            cb.items.forEach(function (it) { addRecommendedDishToOrder(it, true); });
            showToast('已将「' + cb.title + '」加入点菜，去统筹看看吧');
            switchTab('planner');
          };
        });

        container.querySelectorAll('[data-stop]').forEach(function (el) {
          el.onclick = function (e) { e.stopPropagation(); };
        });

        container.querySelectorAll('[data-add-rec]').forEach(function (b) {
          b.onclick = function (e) {
            e.stopPropagation();
            var rec = filteredRecs[Number(b.dataset.addRec)];
            if (!rec) return;
            addRecommendedDishToOrder(rec, false);
            renderFridgeRecommend(container);
          };
        });

        container.querySelectorAll('[data-open-rec]').forEach(function (card) {
          card.onclick = function () {
            var rec = filteredRecs[Number(card.dataset.openRec)];
            if (!rec) return;
            if (rec.source === 'mine') openMyDishModal(rec.dish.id, true);
            else openBookDetailModal(rec.dish.id);
          };
        });
      }

      function refreshFridgeModalZoneUI() {
        document.querySelectorAll('#fr-zone-seg .zone-opt').forEach(function (b) {
          var z = b.dataset.fzone;
          b.className = 'zone-opt' + (z === State.frModalZone ? ' on-' + z : '');
        });
      }

      function openFridgeModal(id) {
        var item = id ? State.fridge.find(function (x) { return x.id === id; }) : null;
        document.getElementById('fr-modal-title').textContent = item ? '编辑冰箱食材' : '放进冰箱';
        document.getElementById('fr-id').value = item ? item.id : '';
        document.getElementById('fr-name').value = item ? item.name : '';
        document.getElementById('fr-amount').value = item ? item.amount : '300';
        document.getElementById('fr-unit').value = (item && FRIDGE_UNITS.indexOf(item.unit) !== -1) ? item.unit : 'g';

        State.frModalZone = item ? item.zone : 'fridge';
        State.frZoneManual = !!item;
        var daysLeft = item ? Math.max(1, daysUntilExpiry(item.expiryDate)) : 5;
        document.getElementById('fr-days').value = daysLeft;
        document.getElementById('fr-exp-date').value = item ? item.expiryDate : dateStrOffset(daysLeft);
        document.getElementById('fr-auto-tag').textContent = item ? '已存位置' : '';
        document.getElementById('btn-del-fridge').classList.toggle('hidden', !item);

        refreshFridgeModalZoneUI();
        openModal('modal-fridge');
      }

      function handleSaveFridgeModal() {
        var id = document.getElementById('fr-id').value;
        var name = document.getElementById('fr-name').value.trim();
        var amt = parseFloat(document.getElementById('fr-amount').value);
        var unit = document.getElementById('fr-unit').value || 'g';
        var expDate = document.getElementById('fr-exp-date').value || dateStrOffset(parseInt(document.getElementById('fr-days').value, 10) || 5);

        if (!name) { showToast('请填写食材名称'); return; }
        if (isNaN(amt) || amt <= 0) { showToast('请填写有效重量或数量'); return; }

        var rec = {
          id: id || ('fr_' + Date.now() + '_' + Math.floor(Math.random() * 100)),
          name: name,
          amount: Math.round(amt * 100) / 100,
          unit: unit,
          zone: State.frModalZone || 'fridge',
          expiryDate: expDate
        };

        if (id) {
          var idx = State.fridge.findIndex(function (x) { return x.id === id; });
          if (idx !== -1) State.fridge[idx] = rec;
        } else {
          State.fridge.unshift(rec);
        }

        saveFridge();
        updateFridgeBadge();
        closeModal('modal-fridge');
        if (State.tab === 'fridge') renderFridgeTab();
        if (State.tab === 'planner') renderPlannerTab();
        showToast(id ? '已更新「' + name + '」' : '已存入冰箱：「' + name + '」');
      }

      /* ========================================================================
         11. 渲染 Tab 4：统筹（并行排程时间线 + 冰箱联动采购清单）
         ======================================================================== */
      function renderPlannerTab() {
        var picked = getSelectedDishes();
        var seg = document.getElementById('plan-seg');
        var clearBtn = document.getElementById('btn-plan-clear');
        var body = document.getElementById('plan-content');

        if (!picked.length) {
          seg.classList.add('hidden');
          clearBtn.classList.add('hidden');
          body.innerHTML = '<div class="empty-state">'
            + '<div class="empty-icon">' + NAV_SVG.planner.off + '</div>'
            + '<h3>还没有选中今晚的菜</h3>'
            + '<p>先去「点菜」勾选几道想做的拿手菜，这里会自动排出最快并行备菜顺序与采购清单。</p>'
            + '<button id="btn-empty-order" class="btn-primary-lg" type="button">去点菜</button>'
            + '</div>';
          document.getElementById('btn-empty-order').onclick = function () { switchTab('order'); };
          return;
        }

        seg.classList.remove('hidden');
        clearBtn.classList.remove('hidden');
        document.querySelectorAll('[data-psub]').forEach(function (b) {
          b.classList.toggle('active', b.dataset.psub === State.planSub);
        });

        if (State.planSub === 'timeline') renderTimelineView(body, picked);
        else renderShoppingView(body, picked);
      }

      function renderTimelineView(container, picked) {
        var plan = computeSchedule(picked, State.stoveCount, State.hotSync);

        container.innerHTML = '<div class="ctrl-card">'
          + '<div class="ctrl-group"><span>灶头数</span><div class="stove-seg">'
          + '<button class="stove-btn ' + (State.stoveCount === 1 ? 'active' : '') + '" data-stove="1" type="button">1个灶</button>'
          + '<button class="stove-btn ' + (State.stoveCount === 2 ? 'active' : '') + '" data-stove="2" type="button">2个灶</button>'
          + '</div></div>'
          + '<div class="ctrl-group"><span>热菜齐出锅优化</span>'
          + '<button id="btn-hotsync" class="switch ' + (State.hotSync ? 'on' : '') + '" type="button" aria-label="热菜齐出锅优化"></button>'
          + '</div></div>'

          + '<div class="efficiency-card">'
          + '<div class="eff-headline tabular">顺序做需 <b>' + plan.serial + '</b> 分钟 → 并行统筹仅需 <b class="c-primary">' + plan.total + '</b> 分钟，省时 <b class="c-sage">' + plan.saved + '</b> 分钟</div>'
          + '<div class="eff-dishes">' + picked.map(function (x, i) {
            return '<span class="dish-chip"><i class="color-dot" style="background:' + DISH_PALETTE[i % DISH_PALETTE.length] + ';"></i>'
              + esc(x.dish.name) + (x.qty > 1 ? ' ×' + x.qty : '') + '</span>';
          }).join('') + '</div>'
          + '<div style="margin-top:9px;display:flex;justify-content:flex-end;">'
          + '<button id="btn-tl-deduct" class="btn-ghost-xs" style="background:var(--sage-soft);color:var(--sage);" type="button">🧊 做完一键扣减冰箱库存</button>'
          + '</div></div>'

          + '<div id="timers-strip" class="timers-strip"></div>'

          + '<div class="timeline-list">' + plan.steps.map(function (st) {
            var m = MODE_META[st.mode] || MODE_META.prep;
            var done = !!State.doneSteps[st.uid];
            return '<div class="tl-card m-' + st.mode + (done ? ' is-done' : '') + '">'
              + '<div class="tl-top">'
              + '<span class="tl-window tabular">' + fmtMM(st.start) + ' - ' + fmtMM(st.end) + ' (' + st.min + '分)</span>'
              + '<span class="tag ' + m.cls + '">' + m.label + '</span>'
              + '</div>'
              + '<div class="tl-dish-row">'
              + '<i class="color-dot" style="background:' + st.color + ';"></i>'
              + '<span>' + esc(st.dishName) + '</span>'
              + (st.hotDelayed ? '<span class="tag primary">齐出锅热炒</span>' : '')
              + '</div>'
              + (st.parallelHint ? '<div class="parallel-hint">' + esc(st.parallelHint) + '</div>' : '')
              + '<p class="tl-action">' + esc(st.desc) + '</p>'
              + '<div class="tl-bottom">'
              + '<button class="tl-timer-btn" data-uid="' + esc(st.uid) + '" type="button">⏱️ 计时</button>'
              + '<button class="tl-check-btn ' + (done ? 'done' : '') + '" data-done-step="' + esc(st.uid) + '" type="button">' + (done ? '✓ 已完成' : '○ 标记完成') + '</button>'
              + '</div></div>';
          }).join('') + '</div>';

        container.querySelectorAll('[data-stove]').forEach(function (b) {
          b.onclick = function () {
            State.stoveCount = Number(b.dataset.stove);
            renderTimelineView(container, picked);
          };
        });
        var tlDeduct = document.getElementById('btn-tl-deduct');
        if (tlDeduct) {
          tlDeduct.onclick = function () { promptDeductFridgeForMenu(picked); };
        }
        document.getElementById('btn-hotsync').onclick = function () {
          State.hotSync = !State.hotSync;
          renderTimelineView(container, picked);
          showToast(State.hotSync ? '已开启热菜齐出锅优化' : '已切换为最早完工顺序');
        };
        container.querySelectorAll('.tl-timer-btn').forEach(function (b) {
          b.onclick = function () {
            var st = plan.steps.find(function (x) { return x.uid === b.dataset.uid; });
            if (st) launchOrToggleTimer(st);
          };
        });
        container.querySelectorAll('[data-done-step]').forEach(function (b) {
          b.onclick = function () {
            State.doneSteps[b.dataset.doneStep] = !State.doneSteps[b.dataset.doneStep];
            renderTimelineView(container, picked);
          };
        });
        renderTimersStrip();
      }

      function renderShoppingView(container, picked) {
        var merged = mergeIngredients(picked);
        var analyzed = analyzeShoppingWithFridge(merged);
        var fridgeEnough = analyzed.filter(function (i) { return i.status === 'enough'; });
        var needItems = analyzed.filter(function (i) { return i.status !== 'enough'; });
        var todo = needItems.filter(function (i) { return !State.doneIngs[i.name]; });
        var done = needItems.filter(function (i) { return !!State.doneIngs[i.name]; });

        function rowHTML(item, checked, isFridgeAuto) {
          var extraHint = '';
          if (item.status === 'partial') {
            extraHint = ' · <span style="color:var(--sage);font-weight:600;">冰箱有 ' + esc(item.fridgeSummary) + '</span>';
          } else if (item.status === 'partial_unit') {
            extraHint = ' · <span style="color:var(--sage);font-weight:600;">冰箱已有 ' + esc(item.fridgeSummary) + '</span>';
          } else if (item.status === 'enough') {
            extraHint = ' · <span style="color:var(--sage);font-weight:600;">冰箱存有 ' + esc(item.fridgeSummary) + '</span>';
          }

          return '<div class="shop-row ' + (checked ? 'done' : '') + '"' + (isFridgeAuto ? '' : ' data-ing-name="' + esc(item.name) + '"') + '>'
            + '<div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">'
            + '<span class="shop-checkbox ' + ((checked || isFridgeAuto) ? 'done' : '') + '">' + ((checked || isFridgeAuto) ? '✓' : '') + '</span>'
            + '<div style="min-width:0;">'
            + '<div class="shop-ing-name" style="font-size:13.5px;font-weight:600;">' + esc(item.name) + '</div>'
            + '<div style="font-size:11px;color:var(--text-light);">' + esc(item.dishes.join('、')) + extraHint + '</div>'
            + '</div></div>'
            + '<span class="shop-qty" style="' + (isFridgeAuto ? 'background:var(--sage-soft);color:var(--sage);' : '') + '">' + esc(isFridgeAuto ? item.amountText : item.buyText) + '</span></div>';
        }

        container.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;">'
          + '<span style="font-size:12.5px;color:var(--text-sub);font-weight:500;">待买 ' + todo.length + ' 项 · 冰箱已有 ' + fridgeEnough.length + ' 项</span>'
          + '<div style="display:flex;gap:6px;">'
          + '<button id="btn-shop-deduct" class="btn-ghost-xs" style="height:32px;background:var(--sage-soft);color:var(--sage);" type="button">🧊 扣减库存</button>'
          + '<button id="btn-copy-list" class="btn-primary-sm" style="height:32px;" type="button">📋 复制清单</button>'
          + '</div></div>'
          + (todo.length
            ? '<div class="shop-box"><div class="shop-header"><span>待采购 / 待备食材</span><span>' + todo.length + ' 项</span></div>'
              + todo.map(function (i) { return rowHTML(i, false, false); }).join('') + '</div>'
            : '<div class="empty-state" style="padding:24px 16px;"><h3 style="color:var(--sage);">全部食材已备齐</h3><p style="margin-bottom:0;">切回「最快备菜顺序」即可高效开火</p></div>')
          + (fridgeEnough.length
            ? '<div class="shop-box"><button id="btn-toggle-fridge-have" class="shop-header" style="background:var(--sage-soft);color:var(--sage);" type="button"><span>🧊 冰箱已有 · 无需采购 (' + fridgeEnough.length + ')</span><span>' + (State.fridgeHaveExpanded ? '收起 ▲' : '展开 ▼') + '</span></button>'
              + (State.fridgeHaveExpanded ? fridgeEnough.map(function (i) { return rowHTML(i, false, true); }).join('') : '') + '</div>'
            : '')
          + (done.length
            ? '<div class="shop-box"><button id="btn-toggle-done-ings" class="shop-header" type="button"><span>✅ 已手动备齐 (' + done.length + ')</span><span>' + (State.doneIngsExpanded ? '收起 ▲' : '展开 ▼') + '</span></button>'
              + (State.doneIngsExpanded ? done.map(function (i) { return rowHTML(i, true, false); }).join('') : '') + '</div>'
            : '');

        container.querySelectorAll('[data-ing-name]').forEach(function (row) {
          row.onclick = function () {
            var n = row.dataset.ingName;
            State.doneIngs[n] = !State.doneIngs[n];
            renderShoppingView(container, picked);
          };
        });

        var toggleFridgeHave = document.getElementById('btn-toggle-fridge-have');
        if (toggleFridgeHave) {
          toggleFridgeHave.onclick = function () {
            State.fridgeHaveExpanded = !State.fridgeHaveExpanded;
            renderShoppingView(container, picked);
          };
        }

        var toggleDone = document.getElementById('btn-toggle-done-ings');
        if (toggleDone) {
          toggleDone.onclick = function () {
            State.doneIngsExpanded = !State.doneIngsExpanded;
            renderShoppingView(container, picked);
          };
        }

        document.getElementById('btn-shop-deduct').onclick = function () {
          promptDeductFridgeForMenu(picked);
        };

        document.getElementById('btn-copy-list').onclick = function () {
          var header = '【掌勺簿 · 采购清单】(' + picked.map(function (x) { return x.dish.name; }).join('、') + ')';
          var lines = needItems.map(function (i) {
            return (State.doneIngs[i.name] ? '✓ ' : '☐ ') + i.name + ' ' + i.buyText + '（' + i.dishes.join('、') + '）';
          });
          if (fridgeEnough.length) {
            lines.push('--- 冰箱已有 ---');
            fridgeEnough.forEach(function (i) {
              lines.push('🧊 ' + i.name + '（需 ' + i.amountText + '，冰箱存有 ' + i.fridgeSummary + '）');
            });
          }
          copyTextReliable(header + '\n' + lines.join('\n'));
        };
      }

      /* ========================================================================
         12. 渲染 Tab 4：我的菜谱（严格纯净，绝无任何教程链接）
         ======================================================================== */
      function renderMineTab() {
        document.getElementById('mine-subtitle').textContent = '共 ' + State.myRecipes.length + ' 道个人拿手菜';

        var catsEl = document.getElementById('mine-cats');
        catsEl.innerHTML = MY_CATEGORIES.map(function (c) {
          return '<button class="filter-pill ' + (State.mineCat === c ? 'active' : '') + '" data-mcat="' + c + '" type="button">' + c + '</button>';
        }).join('');
        catsEl.querySelectorAll('[data-mcat]').forEach(function (b) {
          b.onclick = function () { State.mineCat = b.dataset.mcat; renderMineTab(); };
        });

        var kw = State.mineQuery.trim().toLowerCase();
        var list = State.myRecipes.filter(function (d) {
          if (State.mineCat !== '全部' && d.category !== State.mineCat) return false;
          if (!kw) return true;
          return d.name.toLowerCase().indexOf(kw) !== -1
            || (d.desc || '').toLowerCase().indexOf(kw) !== -1
            || (d.ingredients || []).some(function (i) { return (i.name || '').toLowerCase().indexOf(kw) !== -1; });
        });

        var box = document.getElementById('mine-list');
        if (!list.length) {
          box.innerHTML = '<div class="empty-state">'
            + '<div class="empty-icon">' + NAV_SVG.mine.off + '</div>'
            + '<h3>暂无匹配的拿手菜</h3>'
            + '<p>点击右上角「＋ 添加拿手菜」，或去「食谱」收录经典菜谱。</p>'
            + '</div>';
          return;
        }

        box.innerHTML = list.map(function (d) {
          return '<article class="dish-card" data-view-my="' + esc(d.id) + '">'
            + '<div class="thumb">' + renderThumbHTML(d) + '</div>'
            + '<div class="dish-info">'
            + '<h3 class="dish-name">' + esc(d.name) + '</h3>'
            + '<p class="dish-desc">' + esc(d.desc || ((d.ingredients || []).length + ' 种食材 · ' + (d.steps || []).length + ' 步')) + '</p>'
            + '<div class="dish-foot">'
            + '<div class="meta-tags"><span class="tag primary">' + esc(d.category) + '</span><span class="tag">' + getDishMinutes(d) + ' 分钟</span></div>'
            + '<div style="display:flex;gap:5px;flex-shrink:0;" data-stop="1">'
            + '<button class="btn-ghost-xs" data-edit-my="' + esc(d.id) + '" type="button">编辑</button>'
            + '<button class="btn-danger-xs" data-del-my="' + esc(d.id) + '" type="button">删除</button>'
            + '</div></div></div></article>';
        }).join('');

        box.querySelectorAll('[data-view-my]').forEach(function (card) {
          card.onclick = function () { openMyDishModal(card.dataset.viewMy, false); };
        });
        box.querySelectorAll('[data-stop]').forEach(function (el) {
          el.onclick = function (e) { e.stopPropagation(); };
        });
        box.querySelectorAll('[data-edit-my]').forEach(function (b) {
          b.onclick = function (e) { e.stopPropagation(); openEditorModal(b.dataset.editMy); };
        });
        box.querySelectorAll('[data-del-my]').forEach(function (b) {
          b.onclick = function (e) { e.stopPropagation(); confirmDeleteRecipe(b.dataset.delMy); };
        });
      }

      function confirmDeleteRecipe(id) {
        var dish = State.myRecipes.find(function (x) { return x.id === id; });
        if (!dish) return;
        showConfirm('删除菜谱', '确定从「我的菜谱」删除《' + dish.name + '》吗？', function () {
          State.myRecipes = State.myRecipes.filter(function (x) { return x.id !== id; });
          delete State.cart[id];
          saveRecipes();
          saveCart();
          updateOrderBadge();
          closeModal('modal-detail');
          renderMineTab();
          if (State.tab === 'order') renderOrderTab();
          showToast('已删除《' + dish.name + '》');
        });
      }

      /* ========================================================================
         13. 详情抽屉（严格隔离：我的菜谱无任何链接；食谱百科仅含抖音+YouTube）
         ======================================================================== */
      function buildIngStepsMarkup(dish) {
        return '<div class="detail-card">'
          + '<h3 class="card-sec-title"><span>所需食材</span><span style="font-size:12px;font-weight:500;color:var(--text-light);">' + (dish.ingredients || []).length + ' 种</span></h3>'
          + '<div class="ing-grid">' + (dish.ingredients || []).map(function (i) {
            return '<div class="ing-item"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(i.name) + '</span>'
              + '<span style="color:var(--primary);font-weight:600;white-space:nowrap;">' + esc(i.amount) + '</span></div>';
          }).join('') + '</div></div>'

          + '<div class="detail-card">'
          + '<h3 class="card-sec-title"><span>制作步骤</span><span style="font-size:12px;font-weight:500;color:var(--text-light);">共 ' + getDishMinutes(dish) + ' 分钟</span></h3>'
          + '<div style="display:flex;flex-direction:column;gap:8px;">' + (dish.steps || []).map(function (s, i) {
            var m = MODE_META[s.mode] || MODE_META.prep;
            return '<div class="step-row">'
              + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">'
              + '<span style="font-size:12px;font-weight:700;">第 ' + (i + 1) + ' 步 · ' + s.min + ' 分钟</span>'
              + '<span class="tag ' + m.cls + '">' + m.label + '</span></div>'
              + '<div style="font-size:13px;line-height:1.5;">' + esc(s.desc) + '</div></div>';
          }).join('') + '</div></div>';
      }

      /* 我的菜谱 / 点菜详情（绝无任何外部教程链接） */
      function openMyDishModal(id, fromOrder) {
        var dish = State.myRecipes.find(function (x) { return x.id === id; });
        if (!dish) return;
        document.getElementById('detail-title').textContent = dish.name;
        document.getElementById('detail-body').innerHTML = '<div class="detail-card">'
          + '<div class="hero-banner">' + renderThumbHTML(dish) + '</div>'
          + '<h3 style="margin:0;font-size:18px;font-weight:700;">' + esc(dish.name) + '</h3>'
          + (dish.desc ? '<p style="margin:4px 0 9px;font-size:13px;color:var(--text-sub);">' + esc(dish.desc) + '</p>' : '<div style="height:8px;"></div>')
          + '<div class="meta-tags"><span class="tag primary">' + esc(dish.category) + '</span><span class="tag">' + getDishMinutes(dish) + ' 分钟</span></div>'
          + '</div>'
          + buildIngStepsMarkup(dish);

        var foot = document.getElementById('detail-foot');
        if (fromOrder) {
          var q = State.cart[dish.id] || 0;
          foot.innerHTML = '<button id="btn-modal-pick" class="btn-block primary" type="button">'
            + (q > 0 ? '已选 ' + q + ' 份 · 再加一份' : '＋ 加入今晚点菜') + '</button>';
          document.getElementById('btn-modal-pick').onclick = function () {
            adjustCart(dish.id, 1);
            showToast('已加入《' + dish.name + '》');
            closeModal('modal-detail');
          };
        } else {
          foot.innerHTML = '<button id="btn-modal-del" class="btn-block secondary" style="flex:0.55;color:var(--danger);background:var(--danger-soft);" type="button">删除</button>'
            + '<button id="btn-modal-edit" class="btn-block primary" type="button">编辑菜谱</button>';
          document.getElementById('btn-modal-edit').onclick = function () {
            closeModal('modal-detail');
            openEditorModal(dish.id);
          };
          document.getElementById('btn-modal-del').onclick = function () { confirmDeleteRecipe(dish.id); };
        }
        openModal('modal-detail');
      }

      /* 食谱百科详情（仅含抖音 + YouTube 两个按钮，底部仅「添加到我的菜谱」） */

        var added = hasInMyRecipes(dish);

        document.getElementById('detail-title').textContent = dish.name;
        document.getElementById('detail-body').innerHTML = '<div class="detail-card">'
          + '<div class="hero-banner">' + makeFoodSVG(inferArtKind(dish)) + '</div>'
          + '<h3 style="margin:0;font-size:18px;font-weight:700;">' + esc(dish.name) + '</h3>'
          + '<p style="margin:4px 0 9px;font-size:13px;color:var(--text-sub);">' + esc(dish.desc) + '</p>'
          + '<div class="meta-tags">'
          + '<span class="tag primary">' + esc(dish.major + ' · ' + dish.sub) + '</span>'

          + '<div class="detail-card">'

          + '<a class="tut-btn" href="' + dyUrl + '" target="_blank" rel="noopener noreferrer">'
          + '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5 2.59 2.59 0 0 1-2.59-2.59 2.59 2.59 0 0 1 2.59-2.59c.28 0 .54.05.79.13V9.7a5.7 5.7 0 0 0-.79-.05A5.68 5.68 0 0 0 4.18 15.3 5.68 5.68 0 0 0 9.86 21a5.68 5.68 0 0 0 5.68-5.68V9.02a7.3 7.3 0 0 0 4.28 1.38V7.33a4.3 4.3 0 0 1-3.22-1.51Z"/></svg>'

          + '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M21.58 7.19a2.5 2.5 0 0 0-1.76-1.77C18.25 5 12 5 12 5s-6.25 0-7.82.42a2.5 2.5 0 0 0-1.76 1.77C2 8.76 2 12 2 12s0 3.24.42 4.81a2.5 2.5 0 0 0 1.76 1.77C5.75 19 12 19 12 19s6.25 0 7.82-.42a2.5 2.5 0 0 0 1.76-1.77C22 15.24 22 12 22 12s0-3.24-.42-4.81ZM10 15V9l5.2 3-5.2 3Z"/></svg>'

          saveBtn.onclick = function () {

            var cleanDish = {
              id: 'my_' + Date.now() + '_' + Math.floor(Math.random() * 100),
              name: dish.name,
              category: MY_CATEGORIES.indexOf(dish.category) > 0 ? dish.category : '荤菜',

              photo: '',

              steps: JSON.parse(JSON.stringify(dish.steps))

            State.myRecipes.unshift(cleanDish);
            saveRecipes();
            renderCookbookTab();
            foot.innerHTML = '<button class="btn-block saved" type="button" disabled>✓ 已在我的菜谱</button>';

          };

        openModal('modal-detail');
      }

      /* ========================================================================
         14. 添加 / 编辑拿手菜表单
         ======================================================================== */
      function openEditorModal(id) {
        var rObj = id ? State.myRecipes.find(function (x) { return x.id === id; }) : null;
        document.getElementById('editor-title').textContent = rObj ? '编辑拿手菜' : '添加拿手菜';
        document.getElementById('ed-id').value = rObj ? rObj.id : '';
        document.getElementById('ed-name').value = rObj ? rObj.name : '';
        document.getElementById('ed-cat').value = rObj ? rObj.category : '荤菜';
        document.getElementById('ed-desc').value = rObj ? (rObj.desc || '') : '';
        State.edPhoto = rObj ? (rObj.photo || '') : '';
        updateEditorPreview();

        var ingBox = document.getElementById('ed-ings');
        ingBox.innerHTML = '';
        var ings = (rObj && rObj.ingredients && rObj.ingredients.length) ? rObj.ingredients : [{ name: '', amount: '' }];
        ings.forEach(appendIngEditRow);

        var stepBox = document.getElementById('ed-steps');
        stepBox.innerHTML = '';
        var steps = (rObj && rObj.steps && rObj.steps.length) ? rObj.steps : [{ desc: '', min: 5, mode: 'prep' }];
        steps.forEach(appendStepEditRow);

        openModal('modal-editor');
      }

      function updateEditorPreview() {
        var cat = document.getElementById('ed-cat').value || '荤菜';
        var name = document.getElementById('ed-name').value || '';
        document.getElementById('ed-preview').innerHTML = State.edPhoto
          ? '<img src="' + State.edPhoto + '" alt="预览" />'
          : makeFoodSVG(inferArtKind({ name: name, category: cat }));
        document.getElementById('ed-photo-remove').classList.toggle('hidden', !State.edPhoto);
      }

      function appendIngEditRow(ing) {
        var item = ing || { name: '', amount: '' };
        var box = document.getElementById('ed-ings');
        var row = document.createElement('div');
        row.className = 'ing-edit-line';
        row.innerHTML = '<input class="f-input ed-i-name" style="padding:7px 9px;" placeholder="食材名（如：大蒜）" value="' + esc(item.name) + '" />'
          + '<input class="f-input ed-i-amt" style="padding:7px 9px;" placeholder="用量（如：5瓣）" value="' + esc(item.amount) + '" />'
          + '<button type="button" class="close-circle" style="width:26px;height:26px;font-size:11px;">✕</button>';
        row.querySelector('button').onclick = function () {
          if (box.children.length > 1) row.remove();
          else showToast('至少保留一项食材');
        };
        box.appendChild(row);
      }

      function appendStepEditRow(step) {
        var item = step || { desc: '', min: 5, mode: 'prep' };
        var box = document.getElementById('ed-steps');
        var card = document.createElement('div');
        card.className = 'step-edit-box';
        card.dataset.mode = item.mode || 'prep';

        card.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;">'
          + '<span class="ed-s-idx" style="font-size:12px;font-weight:700;color:var(--text-sub);">步骤 ' + (box.children.length + 1) + '</span>'
          + '<button type="button" class="btn-danger-xs ed-s-del" style="height:24px;padding:0 8px;">删除</button></div>'
          + '<textarea rows="2" class="f-textarea ed-s-desc" placeholder="描述该步骤的操作内容...">' + esc(item.desc) + '</textarea>'
          + '<div class="mode-grid">'
          + '<button type="button" class="mode-opt" data-m="prep">备菜切配</button>'
          + '<button type="button" class="mode-opt" data-m="cook">盯火烹饪</button>'
          + '<button type="button" class="mode-opt" data-m="wait_stove">挂机占灶</button>'
          + '<button type="button" class="mode-opt" data-m="wait_free">挂机不占灶</button>'
          + '</div>'
          + '<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);font-weight:600;">预计耗时（分钟）'
          + '<input type="number" min="1" max="360" class="f-input ed-s-min" style="width:72px;padding:5px 8px;" value="' + (item.min || 5) + '" /></label>';

        function refreshModes() {
          var cur = card.dataset.mode;
          card.querySelectorAll('.mode-opt').forEach(function (b) {
            b.className = 'mode-opt' + (b.dataset.m === cur ? ' on-' + cur : '');
          });
        }
        refreshModes();

        card.querySelectorAll('.mode-opt').forEach(function (b) {
          b.onclick = function () { card.dataset.mode = b.dataset.m; refreshModes(); };
        });
        card.querySelector('.ed-s-del').onclick = function () {
          if (box.children.length > 1) {
            card.remove();
            box.querySelectorAll('.ed-s-idx').forEach(function (el, idx) {
              el.textContent = '步骤 ' + (idx + 1);
            });
          } else {
            showToast('至少保留一个步骤');
          }
        };
        box.appendChild(card);
      }

      function handleSaveEditor() {
        var id = document.getElementById('ed-id').value;
        var name = document.getElementById('ed-name').value.trim();
        var cat = document.getElementById('ed-cat').value;
        var desc = document.getElementById('ed-desc').value.trim();
        if (!name) { showToast('请填写菜品名称'); return; }

        var ingredients = [];
        document.querySelectorAll('#ed-ings .ing-edit-line').forEach(function (row) {
          var n = row.querySelector('.ed-i-name').value.trim();
          var a = row.querySelector('.ed-i-amt').value.trim();
          if (n) ingredients.push({ name: n, amount: a || '适量' });
        });
        if (!ingredients.length) { showToast('请至少填写一种食材'); return; }

        var steps = [];
        var missingStep = false;
        document.querySelectorAll('#ed-steps .step-edit-box').forEach(function (card) {
          var d = card.querySelector('.ed-s-desc').value.trim();
          var m = Math.max(1, parseInt(card.querySelector('.ed-s-min').value, 10) || 1);
          var mode = card.dataset.mode || 'prep';
          if (!d) missingStep = true;
          steps.push({ desc: d, min: m, mode: mode });
        });
        if (missingStep || !steps.length) { showToast('请将制作步骤填写完整'); return; }

        var record = {
          id: id || ('my_' + Date.now()),
          name: name,
          category: cat,
          desc: desc,
          photo: State.edPhoto,
          ingredients: ingredients,
          steps: steps
        };

        if (id) {
          var idx = State.myRecipes.findIndex(function (x) { return x.id === id; });
          if (idx !== -1) State.myRecipes[idx] = record;
        } else {
          State.myRecipes.unshift(record);
        }

        saveRecipes();
        closeModal('modal-editor');
        renderMineTab();
        if (State.tab === 'order') renderOrderTab();
        if (State.tab === 'planner') renderPlannerTab();
        showToast(id ? '已更新《' + name + '》' : '已添加《' + name + '》');
      }

      /* ========================================================================
         15. 导航切换与事件初始化
         ======================================================================== */
      function renderNavIcons() {
        document.querySelectorAll('.nav-btn').forEach(function (btn) {
          var isAct = btn.dataset.tab === State.tab;
          btn.classList.toggle('active', isAct);
          var icSpan = btn.querySelector('.nav-ic');
          var set = NAV_SVG[icSpan.dataset.ic];
          if (set) icSpan.innerHTML = isAct ? set.on : set.off;
        });
      }

      function switchTab(tab) {
        State.tab = tab;
        document.querySelectorAll('.tab-view').forEach(function (v) { v.classList.remove('active'); });
        document.getElementById('view-' + tab).classList.add('active');
        renderNavIcons();
        if (tab === 'order') renderOrderTab();
        if (tab === 'cookbook') renderCookbookTab();
        if (tab === 'fridge') renderFridgeTab();
        if (tab === 'planner') renderPlannerTab();
        if (tab === 'mine') renderMineTab();
      }

      function bindEvents() {
        document.querySelectorAll('.nav-btn').forEach(function (btn) {
          btn.onclick = function () { switchTab(btn.dataset.tab); };
        });

        // 点菜悬浮条与已选抽屉
        document.getElementById('btn-go-plan').onclick = function () { switchTab('planner'); };
        document.getElementById('btn-open-cart').onclick = function () { renderCartDrawer(); openModal('modal-cart'); };
        document.getElementById('btn-cart-empty').onclick = clearAllSelected;
        document.getElementById('btn-drawer-plan').onclick = function () { closeModal('modal-cart'); switchTab('planner'); };

        function debounce(fn, wait) {
          var t = null;
          return function () {
            var ctx = this, args = arguments;
            clearTimeout(t);
            t = setTimeout(function () { fn.apply(ctx, args); }, wait);
          };
        }

        // 食谱全局搜索（120ms 防抖，228 道菜输入丝滑无卡顿）
        var bIn = document.getElementById('book-search');
        var bClr = document.getElementById('book-search-clear');
        var debouncedBookSearch = debounce(function () { renderCookbookTab(); }, 120);
        bIn.oninput = function () {
          State.bookQuery = bIn.value;
          bClr.classList.toggle('hidden', !bIn.value);
          debouncedBookSearch();
        };
        bClr.onclick = function () {
          bIn.value = '';
          State.bookQuery = '';
          bClr.classList.add('hidden');
          renderCookbookTab();
        };

        // 冰箱切换与弹窗控件
        document.querySelectorAll('[data-fsub]').forEach(function (b) {
          b.onclick = function () { State.fridgeSub = b.dataset.fsub; renderFridgeTab(); };
        });
        document.getElementById('btn-add-fridge').onclick = function () { openFridgeModal(null); };
        document.getElementById('btn-save-fridge').onclick = handleSaveFridgeModal;
        document.getElementById('btn-del-fridge').onclick = function () {
          var id = document.getElementById('fr-id').value;
          var it = State.fridge.find(function (x) { return x.id === id; });
          if (!it) return;
          showConfirm('移出冰箱', '确定将「' + it.name + '」从冰箱中移除吗？', function () {
            State.fridge = State.fridge.filter(function (x) { return x.id !== id; });
            saveFridge();
            updateFridgeBadge();
            closeModal('modal-fridge');
            if (State.tab === 'fridge') renderFridgeTab();
            if (State.tab === 'planner') renderPlannerTab();
            showToast('已移出「' + it.name + '」');
          });
        };
        document.querySelectorAll('#fr-zone-seg .zone-opt').forEach(function (b) {
          b.onclick = function () {
            State.frModalZone = b.dataset.fzone;
            State.frZoneManual = true;
            document.getElementById('fr-auto-tag').textContent = '已手动选择';
            refreshFridgeModalZoneUI();
          };
        });
        document.getElementById('fr-name').oninput = function (e) {
          if (State.frZoneManual) return;
          var val = e.target.value.trim();
          if (!val) { document.getElementById('fr-auto-tag').textContent = ''; return; }
          var info = classifyIngredient(val);
          State.frModalZone = info.zone;
          document.getElementById('fr-days').value = info.days;
          document.getElementById('fr-exp-date').value = dateStrOffset(info.days);
          document.getElementById('fr-auto-tag').textContent = '自动：' + info.reason;
          refreshFridgeModalZoneUI();
        };
        document.getElementById('fr-days').oninput = function (e) {
          var d = parseInt(e.target.value, 10);
          if (!isNaN(d) && d > 0) document.getElementById('fr-exp-date').value = dateStrOffset(d);
        };
        document.getElementById('fr-exp-date').onchange = function (e) {
          var d = daysUntilExpiry(e.target.value);
          if (d >= 0 && d < 999) document.getElementById('fr-days').value = Math.max(1, d);
        };

        // 统筹切换与重置
        document.querySelectorAll('[data-psub]').forEach(function (b) {
          b.onclick = function () { State.planSub = b.dataset.psub; renderPlannerTab(); };
        });
        document.getElementById('btn-plan-clear').onclick = function () {
          showConfirm('清空已选菜单', '确定清空当前点菜并重新选择吗？', clearAllSelected);
        };

        // 我的菜谱搜索与添加（120ms 防抖）
        var mIn = document.getElementById('mine-search');
        var mClr = document.getElementById('mine-search-clear');
        var debouncedMineSearch = debounce(function () { renderMineTab(); }, 120);
        mIn.oninput = function () {
          State.mineQuery = mIn.value;
          mClr.classList.toggle('hidden', !mIn.value);
          debouncedMineSearch();
        };
        mClr.onclick = function () {
          mIn.value = '';
          State.mineQuery = '';
          mClr.classList.add('hidden');
          renderMineTab();
        };
        document.getElementById('btn-add-mine').onclick = function () { openEditorModal(null); };

        // 编辑器控件
        document.getElementById('btn-add-ing-row').onclick = function () { appendIngEditRow(); };
        document.getElementById('btn-add-step-row').onclick = function () { appendStepEditRow(); };
        document.getElementById('btn-save-mine').onclick = handleSaveEditor;
        document.getElementById('ed-cat').onchange = updateEditorPreview;
        document.getElementById('ed-name').oninput = updateEditorPreview;

        document.getElementById('ed-photo-file').onchange = function (e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          compressImageFile(file, 400).then(function (dataUrl) {
            State.edPhoto = dataUrl;
            updateEditorPreview();
            showToast('成品图已压缩加载');
          }).catch(function () {
            showToast('图片读取失败，请换一张重试');
          });
          e.target.value = '';
        };
        document.getElementById('ed-photo-remove').onclick = function () {
          State.edPhoto = '';
          updateEditorPreview();
        };

        // 抽屉关闭
        document.querySelectorAll('[data-close]').forEach(function (b) {
          b.onclick = function () { closeModal(b.dataset.close); };
        });
        document.querySelectorAll('.mask').forEach(function (m) {
          m.onclick = function (e) { if (e.target === m) m.classList.remove('open'); };
        });
      }

      /* ========================================================================
         16. 同步立即启动（支持 DOMContentLoaded 及已就绪状态直启）
         ======================================================================== */
      var booted = false;
      function bootApp() {
        if (booted) return;
        booted = true;
        loadInitialData();
        bindEvents();
        renderNavIcons();
        updateOrderBadge();
        updateFridgeBadge();
        renderOrderTab();
      }

      if (document.readyState !== 'loading') {
        bootApp();
      } else {
        document.addEventListener('DOMContentLoaded', bootApp);
      }
    })();
  </script>
</body>
</html>
