plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhangshaobu.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhangshaobu.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
